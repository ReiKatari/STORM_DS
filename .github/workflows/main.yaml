name: STORM DS Nightly Build

on:
  push:
    branches: [ '**' ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          add-to-path: true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Build STORM DS
        env:
          STORM_CERT_BASE64: ${{ secrets.STORM_CERT_BASE64 }}
          STORM_CERT_PASSWORD: ${{ secrets.STORM_CERT_PASSWORD }}
          STORM_KEY_ALIAS: ${{ secrets.STORM_KEY_ALIAS }}
          STORM_KEY_PASSWORD: ${{ secrets.STORM_KEY_PASSWORD }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          git config user.name "ReiKatari"
          git config user.email "45316432+ReiKatari@users.noreply.github.com"
          sed -i -e 's/\(versionName = "\)\(.*\)\("\)/\1\2 ('"$COMMIT"')\3/g' buildSrc/src/main/kotlin/AppConfig.kt
          if [ -n "$STORM_CERT_BASE64" ]; then
            echo "$STORM_CERT_BASE64" | base64 -d > ${{runner.workspace}}/storm_cert.jks
            echo "STORM_CERT_FILE=${{runner.workspace}}/storm_cert.jks" >> local.properties
            echo "STORM_CERT_PASSWORD=$STORM_CERT_PASSWORD" >> local.properties
            echo "STORM_KEY_ALIAS=${STORM_KEY_ALIAS:-storm}" >> local.properties
            echo "STORM_KEY_PASSWORD=${STORM_KEY_PASSWORD:-$STORM_CERT_PASSWORD}" >> local.properties
          fi
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubNightlyRelease

      - name: Report Vulkan SPIR-V Header Changes
        if: always()
        run: |
          CHANGED_HEADERS="$(git ls-files -m -- 'melonDS-android-lib/src/*ShaderData.h' 'melonDS-android-lib/src/compatibility/*ShaderData.h' 'app/src/main/cpp/renderer/*ShaderData.h')"
          if [[ -n "$CHANGED_HEADERS" ]]; then
            echo "::warning::Vulkan SPIR-V headers changed during CI build. Commit regenerated headers."
            echo "$CHANGED_HEADERS"
          else
            echo "No Vulkan SPIR-V header changes detected."
          fi

      - name: Update GitHub Nightly Release
        id: update_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: nightly-release
          name: 'Nightly Build'
          body: 'The currently Nightly Build. Whenever new changes are pushed, you can find the latest build here. You can keep this installation alongside your main one.'
          artifacts: app/build/outputs/apk/gitHubNightly/release/*.apk
          artifactContentType: application/vnd.android.package-archive

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STORM-DS-Nightly
          path: app/build/outputs/apk/gitHubNightly/release/*.apk
